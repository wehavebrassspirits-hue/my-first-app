name: Deploy to GitHub Pages

on:
  push:
    branches: ["claude/test-60u2ve"]
  workflow_dispatch:

# Pages への書き込みと OIDC トークンを許可
permissions:
  contents: read
  pages: write
  id-token: write

# 同時実行は1つに（連続pushでも最新だけ反映）
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages（未設定なら自動で有効化）
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
