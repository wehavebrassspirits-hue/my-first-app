name: Update trending recipes

on:
  schedule:
    - cron: "0 21 * * *"   # 毎日 06:00 JST（21:00 UTC）
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch trending recipes
        env:
          RAKUTEN_APP_ID: ${{ secrets.RAKUTEN_APP_ID }}
        run: node scripts/fetch-trending.js

      - name: Commit trending.json if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -f trending.json ]; then git add trending.json; fi
          if git diff --staged --quiet; then
            echo "変更なし"
          else
            git commit -m "chore: update trending recipes"
            git push
          fi
